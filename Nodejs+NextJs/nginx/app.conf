# Nginx reverse-proxy configuration
#
# This file routes all traffic through a single domain:
#   yourdomain.com/api/*  →  Express backend  (port 5000)
#   yourdomain.com/*      →  Next.js frontend (port 3000)
#
# ── Install ──────────────────────────────────────────────────────────────────
#   sudo cp nginx/app.conf /etc/nginx/sites-available/fullstack-app
#   sudo ln -s /etc/nginx/sites-available/fullstack-app \
#              /etc/nginx/sites-enabled/fullstack-app
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name YOUR_DOMAIN_OR_IP;   # ← replace with your EC2 public IP or domain

    # ── Security headers ───────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Backend API ────────────────────────────────────────────────────────
    # Must be declared BEFORE the root location block.
    location /api/ {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Increase timeouts for long-running DB queries
        proxy_read_timeout  120s;
        proxy_send_timeout  120s;
    }

    # ── Health check (backend) ─────────────────────────────────────────────
    location /health {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    # ── Next.js frontend ───────────────────────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

